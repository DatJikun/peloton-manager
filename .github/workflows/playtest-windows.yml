name: playtest-windows

# Builds the Windows playtest zip with tools/pack-windows-playtest.sh and
# publishes it as a GitHub Release asset. The zip is NOT committed to git
# (each committed refresh added ~66 MB to history forever).
#
# Trigger: push a tag `playtest-YYYY-MM-DD` (or `playtest-*`), or run manually.

on:
  push:
    tags: ['playtest-*']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.4.1
  GODOT_RELEASE: stable

jobs:
  pack:
    name: export Windows zip
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Godot project
        run: dotnet restore src/Peloton.Client.Godot/Peloton.Client.Godot.csproj

      - name: Download Godot .NET editor and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}"
          mkdir -p /tmp/godot-setup
          cd /tmp/godot-setup
          curl -sSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux_x86_64.zip"
          curl -sSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_export_templates.tpz"
          unzip -q godot.zip
          tpl="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}.mono"
          mkdir -p "$tpl"
          unzip -q templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates/* "$tpl/"
          ls "$tpl" | head

      - name: Pack
        run: |
          set -euo pipefail
          export GODOT="$(find /tmp/godot-setup -maxdepth 3 -type f -name 'Godot_v*_mono_linux.x86_64' | head -n 1)"
          chmod +x "$GODOT"
          bash tools/pack-windows-playtest.sh

      - name: Upload artifact (always, also for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: PelotonManager-playtest-windows
          path: dist/PelotonManager-playtest-windows.zip

      - name: Publish Release asset (tag runs only)
        if: startsWith(github.ref, 'refs/tags/playtest-')
        uses: softprops/action-gh-release@v2
        with:
          name: Playtest ${{ github.ref_name }}
          body: |
            Windows playtest zip (Godot ${{ env.GODOT_VERSION }} .NET export of `CareerShell.tscn`).
            Rozpakuj cały folder i uruchom `PelotonManager.exe`. Instrukcja w `CZYTAJ_MNIE.txt`.
          files: dist/PelotonManager-playtest-windows.zip
